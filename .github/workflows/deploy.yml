name: Unpack and deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack bundle (binaries uploaded as base64 text)
        run: |
          if ls _bundle/part.* >/dev/null 2>&1; then
            cat _bundle/part.* | base64 -d > /tmp/b.tgz
            tar xzf /tmp/b.tgz -C .
            git rm -rq _bundle
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Unpack site assets [skip ci]" && git push || true
          fi
      - name: Stage
        run: |
          mkdir -p _site
          cp -r christmas.html index.html assets pins *.pdf _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
